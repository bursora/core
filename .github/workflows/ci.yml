name: CI

on:
    pull_request:
        paths-ignore:
            - "**.md"
            - "docs/**"
            - "LICENSE"
            - ".gitignore"
    push:
        branches: [main]
        paths-ignore:
            - "**.md"
            - "docs/**"
            - "LICENSE"
            - ".gitignore"

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

# Dummy build/test env. The self-host flavor (IS_CLOUD unset) needs no real
# secrets; these throwaway values only satisfy lib/env.ts validation so
# `next build`, `bun test`, and the OSS bundle scan can run. None are real
# credentials. The suite is DB-less (in-memory fakes), so no Postgres service
# is provisioned; an unreachable DATABASE_URL is never queried.
env:
    DATABASE_URL: postgres://bursora:bursora@localhost:5432/bursora
    BURSORA_API_KEY_PEPPER: ci-dummy-pepper
    # Base64 of 32 throwaway bytes; only satisfies parseEncryptionKey's length check.
    BURSORA_KEY: Y2ktZHVtbXktZW5jcnlwdGlvbi1rZXktMzItYnl0ZXM=
    BETTER_AUTH_SECRET: ci-dummy-secret
    BETTER_AUTH_URL: http://localhost:3000
    SMTP_HOST: localhost
    SMTP_PORT: "1025"
    CRON_SECRET: ci-dummy-cron
    NEXT_PUBLIC_APP_URL: http://localhost:3000
    GOOGLE_CLIENT_ID: ci-dummy-google-id
    GOOGLE_CLIENT_SECRET: ci-dummy-google-secret
    # Redis is required app-wide; the suite uses in-memory fakes, so a dummy
    # URL only satisfies lib/env.ts validation and is never connected.
    REDIS_URL: redis://localhost:6379

jobs:
    quality:
        name: Lint, typecheck, test, build
        runs-on: ubuntu-latest
        # CLICKHOUSE_URL is required app-wide, so the full `bun test` needs a live
        # ClickHouse; the CH-gated tests run here instead of skipping.
        services:
            clickhouse:
                image: clickhouse/clickhouse-server:24.8
                env:
                    CLICKHOUSE_SKIP_USER_SETUP: 1
                ports:
                    - 8123:8123
                options: >-
                    --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10
        env:
            CLICKHOUSE_URL: http://localhost:8123
            CLICKHOUSE_USER: default
            CLICKHOUSE_PASSWORD: ""
            CLICKHOUSE_DATABASE: default
        steps:
            # core depends on @bursora/sdk via `file:../sdk`, so the sibling repo must
            # sit next to core. Check both out under the workspace as siblings.
            - name: Checkout core
              uses: actions/checkout@v4
              with:
                  path: core
            - name: Checkout @bursora/sdk sibling
              uses: actions/checkout@v4
              with:
                  repository: bursora/sdk
                  ref: main
                  path: sdk
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.13
            # sdk publishes from dist/ (gitignored), so build it before core installs.
            - name: Build @bursora/sdk
              working-directory: sdk
              run: |
                  bun install
                  bun run build
                  test -f dist/index.mjs
            - name: Install core
              working-directory: core
              run: bun install
            - name: Lint
              working-directory: core
              run: bun run lint
            - name: Typecheck
              working-directory: core
              run: bun run typecheck
            - name: Test
              working-directory: core
              run: bun test
            - name: Build
              working-directory: core
              run: bun run build

    oss-build:
        name: No EE symbols in OSS bundle
        runs-on: ubuntu-latest
        steps:
            - name: Checkout core
              uses: actions/checkout@v4
              with:
                  path: core
            - name: Checkout @bursora/sdk sibling
              uses: actions/checkout@v4
              with:
                  repository: bursora/sdk
                  ref: main
                  path: sdk
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.13
            - name: Build @bursora/sdk
              working-directory: sdk
              run: |
                  bun install
                  bun run build
                  test -f dist/index.mjs
            - name: Install core
              working-directory: core
              run: bun install
            - name: Verify OSS bundle excludes lib/ee
              working-directory: core
              run: ./scripts/verify-oss-build.sh
