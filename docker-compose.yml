# Bursora self-host compose. Run from the umbrella repo root (which holds
# core/ and sdk/) so the build context resolves the sibling SDK package:
#
#   cp core/.env.example core/.env
#   # edit core/.env: set BURSORA_API_KEY_PEPPER, BETTER_AUTH_SECRET
#   docker compose -f core/docker-compose.yml up -d
#   docker compose -f core/docker-compose.yml run --rm bursora bun run db:migrate
#
# Brings up the Next.js app, Postgres, Redis, ClickHouse, and a Mailhog SMTP
# catcher (sign-in emails land in its web UI at http://localhost:8100, no
# external SMTP server needed). Run the one-off `db:migrate` command above once
# after `up` to provision both Postgres and ClickHouse. Put a reverse proxy
# (Caddy, nginx, Traefik) in front for TLS.
#
# Local dev: run `bun run dev` on the host against these datastores.

services:
    bursora:
        build:
            context: ..
            dockerfile: core/Dockerfile
        image: bursora:latest
        restart: unless-stopped
        env_file: .env
        ports:
            - "${APP_PORT:-3000}:3000"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_started
            clickhouse-server:
                condition: service_healthy
            mailhog:
                condition: service_started
        healthcheck:
            test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/login"]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 30s

    postgres:
        image: postgres:16-alpine
        restart: unless-stopped
        # Scope the datastore to only the POSTGRES_* vars it needs, not the
        # app's full secret set. Defaults match .env.example.
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-bursora}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bursora}
            POSTGRES_DB: ${POSTGRES_DB:-bursora}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bursora} -d ${POSTGRES_DB:-bursora}"]
            interval: 10s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        volumes:
            - redis_data:/data

    clickhouse-server:
        image: clickhouse/clickhouse-server:24.8
        restart: unless-stopped
        environment:
            # The 24.8 image locks the default user unless setup is skipped.
            CLICKHOUSE_SKIP_USER_SETUP: "1"
        ulimits:
            nofile:
                soft: 262144
                hard: 262144
        # Bind to loopback only, never 0.0.0.0. This image runs the default user
        # with no password and ClickHouse is the source of truth for every
        # tenant's usage events, so a public bind would expose unauthenticated
        # read/write to all workspaces' spend. 127.0.0.1 keeps it reachable for
        # host-side `bun run dev` (CLICKHOUSE_URL=http://localhost:8123) while
        # staying off every external interface. In-container callers use the
        # compose network (clickhouse-server:8123) regardless.
        ports:
            - "127.0.0.1:${CLICKHOUSE_PORT:-8123}:8123"
        volumes:
            - clickhouse_data:/var/lib/clickhouse
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    # Bundled SMTP catcher so the five-minute path delivers sign-in emails with
    # no external SMTP server. The app reaches it over the compose network at
    # `mailhog:1025` (SMTP_HOST=mailhog). Read the caught emails in the web UI
    # at http://localhost:8100. Swap SMTP_HOST/PORT for a real relay in prod.
    mailhog:
        image: mailhog/mailhog
        restart: unless-stopped
        logging:
            driver: "none"
        ports:
            - "${MAILHOG_UI_PORT:-8100}:8025"

volumes:
    postgres_data: {}
    redis_data: {}
    clickhouse_data: {}
