# Self-host only. Bursora Cloud uses a shared host-level bun container.
#
# Bursora self-host compose. Run from the umbrella repo root (which holds
# core/ and sdk/) so the build context resolves the sibling SDK package:
#
#   cp core/.env.example core/.env
#   # edit core/.env: set BURSORA_API_KEY_PEPPER, BETTER_AUTH_SECRET, CRON_SECRET
#   docker compose -f core/docker-compose.yml up -d
#
# Brings up the Next.js app, Postgres, and Redis. Migrations run once on
# startup via the `migrate` service before the app boots. Put a reverse
# proxy (Caddy, nginx, Traefik) in front for TLS.
#
# Dev workflow (mounts source, runs `bun run dev`) lives behind a profile:
#   docker compose -f core/docker-compose.yml --profile dev up
# That target attaches to the host's external `develop` network and reuses
# its postgres/mailhog instead of the bundled services here.

services:
    bursora:
        build:
            context: ..
            dockerfile: core/Dockerfile
        image: bursora:latest
        restart: unless-stopped
        env_file: .env
        ports:
            - "3000:3000"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_started
            migrate:
                condition: service_completed_successfully
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 30s

    migrate:
        build:
            context: ..
            dockerfile: core/Dockerfile
        image: bursora:latest
        restart: "no"
        env_file: .env
        command: ["bun", "run", "db:migrate"]
        depends_on:
            postgres:
                condition: service_healthy

    postgres:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-bursora}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bursora}
            POSTGRES_DB: ${POSTGRES_DB:-bursora}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bursora} -d ${POSTGRES_DB:-bursora}"]
            interval: 10s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        volumes:
            - redis_data:/data

    # Dev-only: reuses the host VPS's shared `develop` network and its
    # existing postgres/mailhog containers. Run with `--profile dev up`.
    app:
        profiles: ["dev"]
        image: oven/bun:1.3
        working_dir: /app
        command: bun run dev
        environment:
            DATABASE_URL: postgres://postgres:postgres@postgres:5432/bursora_dev
            SMTP_HOST: mailhog
            SMTP_PORT: "1025"
            APP_URL: http://localhost:3000
            NODE_ENV: development
            BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-secret-change-me}
            BETTER_AUTH_URL: http://localhost:3000
        ports:
            - "3000:3000"
        volumes:
            - .:/app
            - bursora_node_modules:/app/node_modules
        networks:
            - develop

volumes:
    postgres_data: {}
    redis_data: {}
    bursora_node_modules: {}

networks:
    develop:
        external: true
