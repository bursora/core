# Bursora self-host compose. Run from the umbrella repo root (which holds
# core/ and sdk/) so the build context resolves the sibling SDK package:
#
#   cp core/.env.example core/.env
#   # edit core/.env: set BURSORA_API_KEY_PEPPER, BETTER_AUTH_SECRET, CRON_SECRET
#   docker compose -f core/docker-compose.yml up -d
#   docker compose -f core/docker-compose.yml run --rm bursora bun run db:migrate
#
# Brings up the Next.js app, Postgres, Redis, and ClickHouse. Run the one-off
# `db:migrate` command above once after `up` to provision both Postgres and
# ClickHouse. Put a reverse proxy (Caddy, nginx, Traefik) in front for TLS.
#
# Local dev: run `bun run dev` on the host against these datastores. Add the
# mailhog SMTP catcher with `--profile dev up` to view dev emails at :8100.

services:
    bursora:
        build:
            context: ..
            dockerfile: core/Dockerfile
        image: bursora:latest
        restart: unless-stopped
        env_file: .env
        ports:
            - "${APP_PORT:-3000}:3000"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_started
            clickhouse-server:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/login"]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 30s

    postgres:
        image: postgres:16-alpine
        restart: unless-stopped
        # Scope the datastore to only the POSTGRES_* vars it needs, not the
        # app's full secret set. Defaults match .env.example.
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-bursora}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bursora}
            POSTGRES_DB: ${POSTGRES_DB:-bursora}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bursora} -d ${POSTGRES_DB:-bursora}"]
            interval: 10s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        volumes:
            - redis_data:/data

    clickhouse-server:
        image: clickhouse/clickhouse-server:24.8
        restart: unless-stopped
        environment:
            # The 24.8 image locks the default user unless setup is skipped.
            CLICKHOUSE_SKIP_USER_SETUP: "1"
        ulimits:
            nofile:
                soft: 262144
                hard: 262144
        # No host port. ClickHouse is the single source of truth for every
        # tenant's usage events and this image runs the default user with no
        # password. The app reaches it over the internal compose network
        # (CLICKHOUSE_URL=http://clickhouse-server:8123) and migrations run via
        # `docker compose run`, so 8123 never needs publishing. Binding it to the
        # host would expose unauthenticated read/write to all workspaces' spend.
        volumes:
            - clickhouse_data:/var/lib/clickhouse
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    # Dev SMTP catcher. Run `bun run dev` on the host with SMTP pointed at it
    # (localhost:8003). Dev-only: starts with `--profile dev`, not on `up -d`.
    mailhog:
        profiles: ["dev"]
        image: mailhog/mailhog
        logging:
            driver: "none"
        ports:
            - "8003:1025"
            - "8100:8025"

volumes:
    postgres_data: {}
    redis_data: {}
    clickhouse_data: {}
